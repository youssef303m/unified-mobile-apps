# Flow 7 (04-build/testing.md §4): switch playlist → the catalogue re-syncs → Home shows the new
# content. The fixture account has an Xtream playlist, an M3U playlist and a Stalker portal. The
# Home hero is the newest movie with artwork of the loaded playlist (N-01).
appId: com.iboplayer.mobile
name: "Flow 7 - switch playlist"
---
- runFlow:
    file: common/fresh-start.yaml
    env:
      ACCOUNT: active
- runFlow: common/accept-and-verify.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
# The Xtream playlist loads first; Home shows its newest movie.
- assertVisible: ".*Fixture Xtream.*"
- extendedWaitUntil:
    visible: 'EN - Fixture Movie 1 \(2000\)'
    timeout: 60000

# Switch to the M3U playlist from the Home playlist chip.
- tapOn:
    id: "home-playlist-chip"
- extendedWaitUntil:
    visible:
      id: "playlists-screen"
    timeout: 15000
- assertVisible: "CURRENT"
- tapOn: "Fixture M3U"
- assertVisible: 'Switch playlist\?'
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- assertVisible: ".*Fixture M3U.*"
- extendedWaitUntil:
    visible: 'Dune Part Two \(2024\)'
    timeout: 60000
- assertNotVisible: 'EN - Fixture Movie 1 \(2000\)'

# The new selection survives a restart (R-020 automatic: the saved playlist).
- stopApp
- runFlow: common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- assertVisible: ".*Fixture M3U.*"
