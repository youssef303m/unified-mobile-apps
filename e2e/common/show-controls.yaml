# The player controls hide on their own (10 s VOD, 7.5 s live) and a tap toggles them: tap the
# screen only when the control we need is not on screen. CONTROL: a control's id; SCREEN: the
# player's id.
appId: com.iboplayer.mobile
---
- runFlow:
    when:
      notVisible:
        id: ${CONTROL}
    commands:
      - tapOn:
          id: ${SCREEN}
- extendedWaitUntil:
    visible:
      id: ${CONTROL}
    timeout: 5000
