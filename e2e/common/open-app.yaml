# Opens the development build on the dev server (a cold start otherwise shows the dev launcher).
# The PC's Metro is reachable on the phone as localhost:8081 through `adb reverse` (e2e/README.md).
appId: com.iboplayer.mobile
---
- launchApp:
    stopApp: false
- openLink: "iboplayer://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible:
      id: "(loading-screen|terms-screen|verify-screen|welcome-screen|expired-screen|server-failed-screen|playlists-screen|home-screen)"
    timeout: 120000
